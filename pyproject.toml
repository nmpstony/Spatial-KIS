[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-kis"
version = "0.1.0"
description = "Local-first spatial video retrieval for KIS"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "Pillow>=10.4",
  "scenedetect[opencv]>=0.6.4",
  "open-clip-torch>=2.26",
  "torch>=2.3",
  "pymilvus>=2.5",
  "transformers>=4.46",
  "sentencepiece>=0.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
